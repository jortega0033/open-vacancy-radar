name: CI

# The everyday quality gate: the same four commands documented in CONTRIBUTING.md's
# "Before opening a PR" checklist, run automatically on every push and pull request.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` pinned here on purpose: this reads the pnpm version straight from the
      # repo's own `packageManager` field (package.json), so the workflow can't silently drift
      # from what `pnpm install` locally actually uses.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADI-09. `pnpm assets:validate` (scripts/assets/validate_assets.py, docs/assets.md) already
      # existed and already passed locally in a documented Python venv, but nothing in CI ran it
      # before this -- a committed brand-asset regression (a missing PNG size, a malformed SVG, an
      # embedded external reference) would have gone undetected until someone happened to run it by
      # hand. `python -m pip install`, not the maintainer-only `venv` steps docs/assets.md
      # documents for local use: a CI runner is already an isolated, disposable environment, so a
      # venv adds ceremony with no isolation benefit here.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install asset tooling
        run: python -m pip install -r scripts/assets/requirements.txt

      - name: Validate assets
        run: pnpm assets:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # ADI-04. Already covered by `pnpm test` above, but run again as a named step so a provider
      # conformance regression is identifiable from the job summary alone, rather than being one
      # failing file inside a 20-package recursive run. These are the tests that pin the v1 adapter
      # contract, the supervised-vs-unsupervised event identity, the accepted-work boundaries, and
      # the always-deny fallback gate.
      - name: Provider conformance
        run: pnpm test:provider-conformance

      - name: Build
        run: pnpm build

      # ADI-09. `--prod` scopes this to dependencies actually reachable from a shipped runtime
      # path -- a vulnerable devDependency (a build tool, a test runner) never blocks this gate,
      # matching upstream AgentDock's own reasoning for the same flag. Verified clean on this repo
      # before adding: `pnpm audit --prod` reports "No known vulnerabilities found" today, so this
      # is a real gate from the moment it ships, not a check added pre-armed to fail.
      - name: Production dependency audit
        run: pnpm audit --prod
