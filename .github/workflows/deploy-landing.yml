name: Deploy landing to Firebase Hosting

on:
  push:
    branches: [master]
    paths:
      - apps/landing/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: landing-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ovr-landing
          workload_identity_provider: projects/662399741047/locations/global/workloadIdentityPools/ovr-github/providers/github
          service_account: github-landing-deploy@ovr-landing.iam.gserviceaccount.com
      - name: Deploy landing page
        run: npx firebase-tools@latest deploy --only hosting:landing --project ovr-landing --non-interactive
