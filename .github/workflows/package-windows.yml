name: Windows Packaging

# Proves the NSIS packaging pipeline (electron-builder) still produces a real installer: the
# one thing Core CI's `pnpm build` alone doesn't exercise. See docs/packaging.md for why a
# packaging-sensitive change needs this and not just a plain build. No signing, no publishing,
# no release automation. This only verifies packaging still works.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-win:
    name: Package Windows installer
    # node-gyp 11 does not recognize the Visual Studio 18 image currently behind windows-latest.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package (electron-builder, NSIS)
        run: pnpm package:win

      # `pnpm package:win` can exit 0 without electron-builder actually having produced an
      # installer (e.g. a silently-skipped target), so fail the job explicitly rather than trust
      # the exit code alone.
      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-packages" -Filter "Open Vacancy Radar-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "No NSIS installer found matching dist-packages/Open Vacancy Radar-Setup-*.exe"
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"

          $exePath = "dist-packages/win-unpacked/Open Vacancy Radar.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Unpacked executable not found at $exePath"
            exit 1
          }
          Write-Host "Found unpacked executable: $exePath"

      # ADI-04. Deliberately positioned AFTER packaging: `pnpm package:win` runs `prepackage:win`,
      # which compiles apps/daemon/dist/agent-dock-job-host.exe. These tests exercise that real
      # compiled helper — including the negative control proving `taskkill /T /F` cannot reach an
      # orphan whose intermediate parent already exited, which is the gap the Job Object closes.
      # Running them before packaging would test a helper this job had not built yet.
      - name: Windows process-tree termination tests
        run: pnpm test:windows-process-tree

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Open-Vacancy-Radar-Windows-CI
          path: dist-packages/Open Vacancy Radar-Setup-*.exe
          retention-days: 7
          if-no-files-found: error
