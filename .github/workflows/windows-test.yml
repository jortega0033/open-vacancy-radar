name: Windows Test Suite

# ADI-09 (#127). Proves the full test suite is actually green on Windows, on both ends of the
# supported Node range -- ci.yml's build-and-test job only runs on ubuntu-latest, so this was
# previously unverified in CI at all, despite this being a Windows-only desktop application
# (electron-builder.yml's only packaging target is `nsis`/win).
#
# Ported from upstream AgentDock's own windows-test.yml, minus its second job
# (`stress-flaky-files`, a targeted repetition-stress run for two specific files upstream had
# observed flaking under Windows' real parallel-worker CPU/IO contention). Deliberately not ported:
# one of the two files it names (apps/daemon/test/subagent-worktree.test.ts) does not exist in this
# repo at all -- worktree/subagent functionality is still ADI-12's own deferred design work, not
# shipped here -- and there is no evidence this repo's other file (apps/desktop/test/App.test.tsx,
# which does exist) has ever actually flaked on Windows. Speculatively stress-testing a file with no
# observed problem, based on a different repo's history, is exactly the kind of blind port this
# project's own review discipline exists to catch. If this job's own real Windows runs surface a
# genuinely flaky file here, that is the moment to add a targeted repetition-stress job for
# whichever file actually earned it -- not preemptively, for someone else's history.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full suite (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json's "engines": { "node": ">=20 <23" } (ADI-09 stage 1) -- 20 is the
        # floor, 22 is what every other CI workflow in this repo actually pins.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
