name: Release

# Automates docs/release-checklist.md's sections 6 (Artifact hashes) and 7 (Tag and publish): once
# a v* tag is pushed, build the same NSIS installer package-windows.yml already verifies on every
# push/PR, compute its SHA-256, and publish both as a GitHub Release. This does not replace the
# rest of the checklist (versioning, the clean build, the installed-app smoke test) -- those still
# happen by hand, on the commit being tagged, before the tag is pushed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # beyond the default read-only GITHUB_TOKEN: creating a release needs this

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release build mid-publish

jobs:
  release:
    name: Build and publish the Windows installer
    # node-gyp 11 does not recognize the Visual Studio 18 image currently behind windows-latest.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Electron end-to-end tests
        run: pnpm --filter @agent-dock/desktop test:e2e

      - name: Package (electron-builder, NSIS)
        run: pnpm package:win

      # Same check package-windows.yml runs on every push/PR: pnpm package:win can exit 0 without
      # electron-builder actually having produced an installer.
      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-packages" -Filter "Open Vacancy Radar-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "No NSIS installer found matching dist-packages/Open Vacancy Radar-Setup-*.exe"
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-packages" -Filter "Open Vacancy Radar-Setup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          Write-Host "SHA-256: $hash"

      # Uses the checklist's own release-notes file when the tag's version has one, so a release cut
      # by hand still gets its written notes attached rather than gh's auto-generated commit list.
      - name: Resolve release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag must be a semantic version beginning with v."
            exit 1
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $notesPath = "docs/release-notes-v$version.md"
          if (Test-Path $notesPath) {
            Write-Host "Using $notesPath"
            "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No $notesPath found; gh release create will auto-generate notes instead."
            "path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # PowerShell does not glob-expand a bare "*" the way a POSIX shell would, so the
          # installer and its checksum are resolved to real paths here rather than passed as a
          # literal wildcard string gh would fail to match.
          $installer = (Get-ChildItem -Path "dist-packages" -Filter "Open Vacancy Radar-Setup-*.exe").FullName
          $checksum = "$installer.sha256"

          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $args = @('release', 'edit', $tag, '--title', $tag)
            if ($env:NOTES_PATH -ne '') {
              $args += @('--notes-file', $env:NOTES_PATH)
            }
            gh @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $installer $checksum --clobber
          } else {
            $args = @('release', 'create', $tag, $installer, $checksum, '--title', $tag)
            if ($env:NOTES_PATH -ne '') {
              $args += @('--notes-file', $env:NOTES_PATH)
            } else {
              $args += '--generate-notes'
            }
            gh @args
          }
