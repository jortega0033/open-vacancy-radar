version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - jortega0033
    commit-message:
      prefix: deps
    ignore:
      # The root package.json pins esbuild with a pnpm override (^0.25.0). A bump of the direct
      # dependency alone breaks the frozen lockfile, so move both together on purpose.
      - dependency-name: esbuild
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
    reviewers:
      - jortega0033
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
