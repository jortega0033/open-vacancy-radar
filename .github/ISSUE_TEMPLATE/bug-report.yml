name: Bug report
description: Report a reproducible problem in Open Vacancy Radar.
title: '[Bug]: '
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Open Vacancy Radar. Do not include credentials, personal application data, CV contents, tokens, or private security details.

  - type: checkboxes
    id: existing
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability. Security reports belong in a private advisory.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vacancy discovery or crawling
        - Filtering or scoring
        - Desktop interface
        - Saved jobs or applications
        - CVs or letters
        - Settings or local data
        - Packaging or installation
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA where the problem occurs.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node.js version, pnpm version, and install type.
      placeholder: Windows 11 x64; Node 22.x; pnpm 10.29.2; packaged app
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact names, CV/application content, credentials, tokens, usernames, and private filesystem paths.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
