<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src is 'self': the renderer does not call the daemon over HTTP/SSE directly.
      The daemon does not approve CORS preflight requests; see SECURITY.md. All daemon calls go through the Electron main process
      via IPC (electron/main.ts + electron/preload.ts), which isn't subject to this CSP at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Vacancy Radar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
