# electron-builder configuration for the Open Vacancy Radar desktop app.
#
# appId is a placeholder reverse-DNS identifier, not a claim to own that domain. Forks intended
# for distribution should set their own appId and productName.
appId: dev.agentdock.desktop
productName: Open Vacancy Radar
copyright: Copyright © Open Vacancy Radar contributors

directories:
  # Keep installer and unpacked-app output separate from Vite's dist/, esbuild's dist-electron/,
  # and the repository's node_modules.
  output: ../../dist-packages
  buildResources: assets/app-icons

# main.js and preload.js are mostly self-contained bundles (see vite.config.ts). The renderer is a
# self-contained Vite build. `better-sqlite3` is the exception: Rollup leaves the
# native addon external, so it remains a production dependency and electron-builder includes and
# smart-unpacks its binding. The explicit files list stays limited; builder's dependency walker adds
# that one required runtime module without copying the renderer's already-bundled dependencies.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# The packaged app spawns the daemon as a separate process (see electron/main.ts), so `spawn()`
# needs a regular file on disk. The daemon is an extraResource outside app.asar instead of a path
# inside the archive. apps/daemon/dist/index.js is already a self-contained esbuild bundle (see
# apps/daemon/scripts/build.mjs), so it needs no additional files.
extraResources:
  - from: ../daemon/dist
    to: daemon
  - from: assets/app-icons/png/icon-256.png
    to: assets/app-icons/png/icon-256.png

asar: true

# Auto-update is not implemented (see docs/architecture.md). Without
# this, electron-builder still tries to generate update-feed metadata (latest.yml, .blockmap) and
# infer a publish target from the git remote, which crashes when there isn't one configured.
publish: null

win:
  executableName: Open Vacancy Radar
  icon: open-vacancy-radar.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Open Vacancy Radar
  installerIcon: open-vacancy-radar.ico
  uninstallerIcon: open-vacancy-radar.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  # A .blockmap is only useful for differential auto-update downloads, which this project doesn't
  # have. Do not generate a file that the app cannot use.
  differentialPackage: false
